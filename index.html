    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvvR2Jqox9gTouYUUq3B5vchVMsqf1rzc",
            authDomain: "breakfast-f20a8.firebaseapp.com",
            projectId: "breakfast-f20a8",
            storageBucket: "breakfast-f20a8.firebasestorage.app",
            messagingSenderId: "674369144145",
            appId: "1:674369144145:web:c08d62b7fdd6a40d9d3f70"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase initialized successfully.");
        } catch (err) {
            console.error("Firebase initialization failed:", err);
        }

        window.plannerData = {
            Monday: '', Tuesday: '', Wednesday: '', Thursday: '', Friday: '', Saturday: '', Sunday: '',
            breakfastRequest: { active: false, timestamp: 0 }
        };
        window.activeDay = null;
        window.isDataLoaded = false; // Safety lock to prevent blank writes on loading
        let lastAlertTimestamp = 0;

        // Listen to Firestore changes in real-time
        onSnapshot(doc(db, "planners", "weekly-plan"), (docSnap) => {
            window.isDataLoaded = true; // Unlock writes

            if (docSnap.exists()) {
                window.plannerData = docSnap.data();
            } else {
                window.plannerData = { 
                    Monday: '', Tuesday: '', Wednesday: '', Thursday: '', Friday: '', Saturday: '', Sunday: '',
                    breakfastRequest: { active: false, timestamp: 0 }
                };
            }

            // Sync alert state globally
            const req = window.plannerData.breakfastRequest;
            const mySentTimestamp = parseInt(localStorage.getItem('mySentTimestamp') || '0');

            if (req && req.active) {
                // If the alert was sent by THIS device, do not show the popup modal
                if (req.timestamp === mySentTimestamp) {
                    hideAlarmModal();
                } else {
                    showAlarmModal();
                    if (req.timestamp !== lastAlertTimestamp) {
                        lastAlertTimestamp = req.timestamp;
                        triggerLocalAppAlertEffects();
                    }
                }
            } else {
                hideAlarmModal();
            }

            window.renderPlanner();
        }, (err) => {
            console.error("Error reading from Firestore:", err);
            window.plannerData = JSON.parse(localStorage.getItem('breakfastPlannerData')) || window.plannerData;
            window.isDataLoaded = true; // Unlock even if Firestore fails
            window.renderPlanner();
        });

        // Global save trigger
        window.saveDataToBackend = async function() {
            if (!window.isDataLoaded) {
                console.warn("Prevented save: Database is still loading.");
                return;
            }
            try {
                if (!window.plannerData.breakfastRequest) {
                    window.plannerData.breakfastRequest = { active: false, timestamp: 0 };
                }
                // merge: true keeps files perfectly synchronized without complete overrides
                await setDoc(doc(db, "planners", "weekly-plan"), window.plannerData, { merge: true });
            } catch (e) {
                console.error("Firestore write failed:", e);
                localStorage.setItem('breakfastPlannerData', JSON.stringify(window.plannerData));
                window.renderPlanner();
            }
        }
    </script>

        // Active Wake Up Dispatcher
        async function sendWakeUpAlert() {
            if (!window.isDataLoaded) return;

            const now = Date.now();
            
            // Mark locally immediately as "sent" on this device
            localStorage.setItem('mySentTimestamp', now.toString());

            // Instantly update UI locally (Skip sequential DB delays for instant click visual)
            window.plannerData.breakfastRequest = {
                active: true,
                timestamp: now
            };
            window.renderPlanner();

            // Fire ntfy background push request concurrently (Doesn't block user action)
            const isUrdu = currentLang === 'ur';
            const title = isUrdu ? "ناشتہ تیار کریں!" : "Make Breakfast!";
            const body = isUrdu ? "کوئی جاگ گیا ہے اور ناشتے کا انتظار کر رہا ہے۔" : "Someone is awake and waiting for breakfast.";

            fetch(`https://ntfy.sh/${ntfyTopic}`, {
                method: 'POST',
                body: body,
                headers: {
                    'Title': title,
                    'Priority': 'high', // Force vibrate and ring screen popup
                    'Tags': 'coffee,bell'
                }
            }).catch(e => console.error("Push dispatcher error:", e));

            // Write state asynchronously to database
            await window.saveDataToBackend();
        }

        // Custom chime generated dynamically using Web Audio API (No files to download or fail)
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                const playNote = (freq, start, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, start);
                    
                    gain.gain.setValueAtTime(0, start);
                    gain.gain.linearRampToValueAtTime(0.3, start + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + duration);
                };
                
                // Play a pleasant, noticeable double bell chime
                playNote(523.25, now, 0.4);      // C5
                playNote(659.25, now + 0.15, 0.5); // E5
            } catch (e) {
                console.log("Audio play blocked by browser protocol:", e);
            }
        }

        function triggerLocalAppAlertEffects() {
            const isUrdu = currentLang === 'ur';
            const title = isUrdu ? "ناشتہ تیار کریں!" : "Make Breakfast!";
            const body = isUrdu ? "کوئی جاگ گیا ہے اور ناشتے کے لیے تیار ہے۔" : "Someone is awake and requested breakfast.";

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "icon.svg"
                });
            }

            playChime();
        }

        function renderPresets() {
            const container = document.getElementById('presets-container');
            container.innerHTML = '';
            const t = translations[currentLang];
            
            t.presetsList.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "flex items-center gap-3 p-3 border-2 border-slate-100 rounded-2xl hover:border-amber-300 hover:bg-amber-50 text-slate-800 text-base font-bold transition text-left w-full";
                btn.innerHTML = `<span>${p.emoji}</span> <span class="truncate">${p.name}</span>`;
                btn.onclick = () => {
                    document.getElementById('breakfast-input').value = p.name;
                };
                container.appendChild(btn);
            });
        }

        function getMealEmoji(name) {
            const lower = name.toLowerCase();
            if (lower.includes('egg') || lower.includes('toast') || lower.includes('انڈے')) return '🍳';
            if (lower.includes('pancake') || lower.includes('کیک')) return '🥞';
            if (lower.includes('oat') || lower.includes('porridge') || lower.includes('دلیہ')) return '🥣';
            if (lower.includes('smoothie') || lower.includes('shake') || lower.includes('اسموتھی')) return '🥤';
            if (lower.includes('waffle') || lower.includes('وافلز')) return '🧇';
            if (lower.includes('croissant') || lower.includes('bread') || lower.includes('روٹی')) return '🥐';
            if (lower.includes('fruit') || lower.includes('salad') || lower.includes('پھل')) return '🍓';
            return '🍽️';
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('breakfastLang', lang);
            window.renderPlanner();
        }

        function openModal(day) {
            window.activeDay = day;
            const t = translations[currentLang];
            
            document.getElementById('modal-title').innerText = `${t.planTitle}${t.days[day]}`;
            document.getElementById('breakfast-input').value = window.plannerData[day] || '';
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                if (window.innerWidth < 640) {
                    modal.firstElementChild.classList.remove('translate-y-full');
                    modal.firstElementChild.classList.add('translate-y-0');
                } else {
                    modal.firstElementChild.classList.remove('scale-95');
                    modal.firstElementChild.classList.add('scale-100');
                }
            }, 10);
        }

        function openTodayModal() {
            openModal(getTodayEnglishDay());
        }

        function closeModal() {
            const modal = document.getElementById('edit-modal');
            if (window.innerWidth < 640) {
                modal.firstElementChild.classList.remove('translate-y-0');
                modal.firstElementChild.classList.add('translate-y-full');
            } else {
                modal.firstElementChild.classList.remove('scale-100');
                modal.firstElementChild.classList.add('scale-95');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                window.activeDay = null;
            }, 150);
        }

        async function saveBreakfast() {
            if (!window.activeDay) return;
            const inputVal = document.getElementById('breakfast-input').value.trim();
            window.plannerData[window.activeDay] = inputVal;
            
            if (typeof window.saveDataToBackend === 'function') {
                await window.saveDataToBackend();
            }
            closeModal();
        }

        async function clearDay(day) {
            window.plannerData[day] = '';
            if (typeof window.saveDataToBackend === 'function') {
                await window.saveDataToBackend();
            }
        }

        async function resetWeek() {
            const t = translations[currentLang];
            if (confirm(t.resetConfirm)) {
                if (!window.isDataLoaded) return;
                daysKeyList.forEach(day => window.plannerData[day] = '');
                if (typeof window.saveDataToBackend === 'function') {
                    await window.saveDataToBackend();
                }
            }
        }

        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.warn('Service Worker Registration Failed', err));
            });
        }
    </script>
</body>
</html>
