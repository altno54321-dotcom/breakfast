<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breakfast</title>
    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');
        
        .font-urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            line-height: 2.0;
        }
        .font-english {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        /* Prevent elastic bounce scrolling on mobile iOS devices */
        html, body {
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-english selection:bg-amber-100 selection:text-amber-900 transition-all duration-200">

    <!-- Compact Mobile Header -->
    <header class="bg-white border-b border-slate-100 py-3.5 px-4 sticky top-0 z-30 shadow-sm backdrop-blur-md bg-white/95">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <!-- Brand Logo & Title -->
            <div class="flex items-center gap-2.5">
                <div class="p-2 bg-amber-500 text-white rounded-xl shadow-md shadow-amber-500/10">
                    <i data-lucide="coffee" class="w-5.5 h-5.5"></i>
                </div>
                <h1 id="app-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Breakfast</h1>
            </div>
            
            <!-- Quick Header Controls -->
            <div class="flex items-center gap-1.5">
                <!-- Compact Language Selector -->
                <select id="lang-selector" onchange="changeLanguage(this.value)" class="bg-slate-100 text-slate-800 font-bold text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="en">EN</option>
                    <option value="ur">اردو</option>
                </select>

                <!-- Icon-only Reset to Save Mobile Space -->
                <button onclick="resetWeek()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition" id="btn-reset-container" title="Reset Week">
                    <i data-lucide="rotate-ccw" class="w-5.5 h-5.5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- App Shell Frame (Constrained width so it looks like a clean phone app even on desktop) -->
    <main class="flex-grow max-w-md w-full mx-auto p-4 space-y-4">
        
        <!-- Today's Breakfast Compact Card (Tapping it opens current day edit) -->
        <section id="todays-banner" onclick="openTodayModal()" class="bg-amber-500 text-white rounded-2xl p-4 shadow-lg shadow-amber-500/10 flex items-center justify-between gap-3 cursor-pointer hover:bg-amber-600 transition active:scale-[0.98]">
            <div class="flex items-center gap-3.5 min-w-0">
                <div class="p-3 bg-white/20 rounded-xl text-2xl flex-shrink-0 leading-none">
                    🍳
                </div>
                <div class="min-w-0">
                    <h2 id="today-heading" class="text-xs font-bold uppercase tracking-wider text-amber-100">Today's Breakfast</h2>
                    <p id="today-meal-text" class="text-lg font-extrabold mt-0.5 truncate">Loading...</p>
                </div>
            </div>
            <div class="p-1.5 bg-white/10 rounded-lg flex-shrink-0">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </div>
        </section>

        <!-- Compact Weekly List -->
        <div class="space-y-2.5">
            <h3 id="weekly-heading" class="text-lg font-extrabold text-slate-500 uppercase tracking-wider px-1">Weekly Plan</h3>
            <div id="planner-grid" class="space-y-2">
                <!-- Standard row items dynamically loaded here -->
            </div>
        </div>
    </main>

    <!-- Slide-over / Compact Bottom Sheet Style Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-200">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-6 pb-8 sm:pb-6 shadow-2xl border-t sm:border border-slate-100 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-200 max-h-[90vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="flex justify-between items-start mb-5 flex-shrink-0">
                <div>
                    <h3 id="modal-title" class="text-xl font-extrabold text-slate-900">Plan Breakfast</h3>
                    <p id="modal-subtitle" class="text-xs text-slate-500">Select or enter your meal</p>
                </div>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-xl text-slate-400 hover:text-slate-600 transition">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Scrollable Form Body -->
            <div class="space-y-5 overflow-y-auto pr-1 flex-grow">
                <div>
                    <label id="label-custom" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Custom Breakfast Name</label>
                    <input type="text" id="breakfast-input" placeholder="e.g., Avocado Toast" 
                        class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 focus:bg-white outline-none transition duration-200 text-lg font-bold">
                </div>

                <!-- Presets Quick Select (Large buttons for easy clicking) -->
                <div>
                    <label id="label-presets" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Quick Presets</label>
                    <div class="grid grid-cols-2 gap-2" id="presets-container">
                        <!-- Filled dynamically -->
                    </div>
                </div>
            </div>

            <!-- Modal Action Footer -->
            <div class="flex gap-3 pt-4 border-t border-slate-100 mt-4 flex-shrink-0">
                <button id="btn-cancel" onclick="closeModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold rounded-xl text-base transition">
                    Cancel
                </button>
                <button id="btn-save" onclick="saveBreakfast()" class="flex-1 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-base transition shadow-lg shadow-amber-500/10">
                    Save Plan
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvvR2Jqox9gTouYUUq3B5vchVMsqf1rzc",
            authDomain: "breakfast-f20a8.firebaseapp.com",
            projectId: "breakfast-f20a8",
            storageBucket: "breakfast-f20a8.firebasestorage.app",
            messagingSenderId: "674369144145",
            appId: "1:674369144145:web:c08d62b7fdd6a40d9d3f70"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase initialized successfully.");
        } catch (err) {
            console.error("Firebase initialization failed:", err);
        }

        window.plannerData = {
            Monday: '', Tuesday: '', Wednesday: '', Thursday: '', Friday: '', Saturday: '', Sunday: ''
        };
        window.activeDay = null;

        onSnapshot(doc(db, "planners", "weekly-plan"), (docSnap) => {
            if (docSnap.exists()) {
                window.plannerData = docSnap.data();
            } else {
                window.plannerData = { Monday: '', Tuesday: '', Wednesday: '', Thursday: '', Friday: '', Saturday: '', Sunday: '' };
            }
            window.renderPlanner();
        }, (err) => {
            console.error("Error reading from Firestore:", err);
            window.plannerData = JSON.parse(localStorage.getItem('breakfastPlannerData')) || window.plannerData;
            window.renderPlanner();
        });

        window.saveDataToBackend = async function() {
            try {
                await setDoc(doc(db, "planners", "weekly-plan"), window.plannerData);
            } catch (e) {
                console.error("Firestore write failed:", e);
                localStorage.setItem('breakfastPlannerData', JSON.stringify(window.plannerData));
                window.renderPlanner();
            }
        }
    </script>

    <!-- UI Operations Script -->
    <script>
        const translations = {
            en: {
                appTitle: "Breakfast",
                appSubtitle: "Weekly morning fuel planner",
                todayHeading: "Today's Breakfast",
                noBreakfastToday: "No plan set for today",
                changeToday: "Change Today",
                weeklyHeading: "Weekly Plan",
                resetWeek: "Reset Week",
                resetConfirm: "Are you sure you want to clear your planned breakfasts for the entire week?",
                noMeal: "Tap to plan...",
                addBreakfast: "Add Breakfast",
                edit: "Edit",
                clear: "Clear",
                customName: "Custom Breakfast Name",
                presets: "Quick Presets",
                save: "Save Plan",
                cancel: "Cancel",
                planTitle: "Plan for ",
                placeholder: "e.g., Avocado Toast",
                todayLabel: "Today",
                days: {
                    Monday: "Monday",
                    Tuesday: "Tuesday",
                    Wednesday: "Wednesday",
                    Thursday: "Thursday",
                    Friday: "Friday",
                    Saturday: "Saturday",
                    Sunday: "Sunday"
                },
                presetsList: [
                    { emoji: '🍳', name: 'Eggs & Toast' },
                    { emoji: '🥞', name: 'Fluffy Pancakes' },
                    { emoji: '🥣', name: 'Oatmeal Bowl' },
                    { emoji: '🥤', name: 'Fruit Smoothie' },
                    { emoji: '🥑', name: 'Avocado Toast' },
                    { emoji: '🧇', name: 'Belgian Waffles' }
                ]
            },
            ur: {
                appTitle: "ناشتہ",
                appSubtitle: "ہفتہ وار ناشتے کا منصوبہ",
                todayHeading: "آج کا ناشتہ",
                noBreakfastToday: "آج کا کوئی منصوبہ نہیں ہے",
                changeToday: "آج کا تبدیل کریں",
                weeklyHeading: "پورے ہفتے کا منصوبہ",
                resetWeek: "ہفتہ ری سیٹ کریں",
                resetConfirm: "کیا آپ واقعی پورا ہفتہ صاف کرنا چاہتے ہیں؟",
                noMeal: "منصوبہ بندی کریں...",
                addBreakfast: "ناشتہ شامل کریں",
                edit: "تبدیل کریں",
                clear: "صاف کریں",
                customName: "اپنی مرضی کا ناشتہ لکھیں",
                presets: "جلدی سے منتخب کریں",
                save: "محفوظ کریں",
                cancel: "منسوخ کریں",
                planTitle: "منصوبہ برائے ",
                placeholder: "مثال کے طور پر: انڈے اور ٹوسٹ",
                todayLabel: "آج",
                days: {
                    Monday: "پیر",
                    Tuesday: "منگل",
                    Wednesday: "بدھ",
                    Thursday: "جمعرات",
                    Friday: "جمعہ",
                    Saturday: "ہفتہ",
                    Sunday: "اتوار"
                },
                presetsList: [
                    { emoji: '🍳', name: 'انڈے اور ٹوسٹ' },
                    { emoji: '🥞', name: 'پین کیکس' },
                    { emoji: '🥣', name: 'دلیہ' },
                    { emoji: '🥤', name: 'فروٹ اسموتھی' },
                    { emoji: '🥑', name: 'ایواکاڈو ٹوسٹ' },
                    { emoji: '🧇', name: 'وافلز' }
                ]
            }
        };

        const daysKeyList = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        let currentLang = localStorage.getItem('breakfastLang') || 'en';

        function getTodayEnglishDay() {
            const date = new Date();
            const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return daysOfWeek[date.getDay()];
        }

        function updateUITexts() {
            const t = translations[currentLang];
            
            if (currentLang === 'ur') {
                document.body.classList.add('font-urdu');
                document.body.classList.remove('font-english');
                document.body.setAttribute('dir', 'rtl');
            } else {
                document.body.classList.add('font-english');
                document.body.classList.remove('font-urdu');
                document.body.setAttribute('dir', 'ltr');
            }

            document.getElementById('app-title').innerText = t.appTitle;
            document.getElementById('today-heading').innerText = t.todayHeading;
            document.getElementById('weekly-heading').innerText = t.weeklyHeading;

            document.getElementById('label-custom').innerText = t.customName;
            document.getElementById('label-presets').innerText = t.presets;
            document.getElementById('btn-cancel').innerText = t.cancel;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('breakfast-input').placeholder = t.placeholder;

            document.getElementById('lang-selector').value = currentLang;
        }

        window.renderPlanner = function() {
            updateUITexts();
            const t = translations[currentLang];
            const grid = document.getElementById('planner-grid');
            grid.innerHTML = '';

            const todayEng = getTodayEnglishDay();
            const todayMeal = window.plannerData[todayEng];
            const bannerText = todayMeal ? `${getMealEmoji(todayMeal)} ${todayMeal}` : t.noBreakfastToday;
            document.getElementById('today-meal-text').innerText = bannerText;

            daysKeyList.forEach(dayKey => {
                const meal = window.plannerData[dayKey];
                const isPlanned = !!meal;
                const translatedDayName = t.days[dayKey];

                const cardHtml = `
                    <div onclick="openModal('${dayKey}')" class="bg-white border ${isPlanned ? 'border-amber-300 ring-1 ring-amber-100/50 shadow-sm' : 'border-slate-200 border-dashed'} rounded-xl p-3.5 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50 transition active:scale-[0.99]">
                        <div class="flex items-center gap-3.5 min-w-0 flex-1">
                            <!-- Left: Day Label & Today Tag -->
                            <div class="w-16 sm:w-20 flex-shrink-0 flex flex-col">
                                <span class="text-base font-extrabold text-slate-800 ${todayEng === dayKey ? 'text-amber-500 underline decoration-2' : ''}">${translatedDayName}</span>
                                ${todayEng === dayKey ? `<span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-500 mt-[-2px]">${t.todayLabel}</span>` : ''}
                            </div>
                            
                            <!-- Middle: Meal Selection -->
                            <div class="flex items-center gap-2 min-w-0 flex-1">
                                ${isPlanned ? `
                                    <span class="text-2xl flex-shrink-0 leading-none">${getMealEmoji(meal)}</span>
                                    <h4 class="font-extrabold text-slate-900 text-base truncate">${meal}</h4>
                                ` : `
                                    <span class="text-slate-400 text-sm italic font-normal">${t.noMeal}</span>
                                `}
                            </div>
                        </div>

                        <!-- Right: Context Action Button (Clear or Add) -->
                        <div class="flex items-center flex-shrink-0">
                            ${isPlanned ? `
                                <button onclick="event.stopPropagation(); clearDay('${dayKey}')" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition" title="${t.clear}">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            ` : `
                                <div class="p-2 text-amber-500 bg-amber-50 rounded-xl">
                                    <i data-lucide="plus" class="w-4.5 h-4.5"></i>
                                </div>
                            `}
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });

            renderPresets();
            lucide.createIcons();
        }

        function renderPresets() {
            const container = document.getElementById('presets-container');
            container.innerHTML = '';
            const t = translations[currentLang];
            
            t.presetsList.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "flex items-center gap-3 p-3 border-2 border-slate-100 rounded-2xl hover:border-amber-300 hover:bg-amber-50 text-slate-800 text-base font-bold transition text-left w-full";
                btn.innerHTML = `<span>${p.emoji}</span> <span class="truncate">${p.name}</span>`;
                btn.onclick = () => {
                    document.getElementById('breakfast-input').value = p.name;
                };
                container.appendChild(btn);
            });
        }

        function getMealEmoji(name) {
            const lower = name.toLowerCase();
            if (lower.includes('egg') || lower.includes('toast') || lower.includes('انڈے')) return '🍳';
            if (lower.includes('pancake') || lower.includes('کیک')) return '🥞';
            if (lower.includes('oat') || lower.includes('porridge') || lower.includes('دلیہ')) return '🥣';
            if (lower.includes('smoothie') || lower.includes('shake') || lower.includes('اسموتھی')) return '🥤';
            if (lower.includes('waffle') || lower.includes('وافلز')) return '🧇';
            if (lower.includes('croissant') || lower.includes('bread') || lower.includes('روٹی')) return '🥐';
            if (lower.includes('fruit') || lower.includes('salad') || lower.includes('پھل')) return '🍓';
            return '🍽️';
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('breakfastLang', lang);
            window.renderPlanner();
        }

        function openModal(day) {
            window.activeDay = day;
            const t = translations[currentLang];
            
            document.getElementById('modal-title').innerText = `${t.planTitle}${t.days[day]}`;
            document.getElementById('breakfast-input').value = window.plannerData[day] || '';
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                // Animate bottom-sheet style layout up on mobile, center scale on desktop
                if (window.innerWidth < 640) {
                    modal.firstElementChild.classList.remove('translate-y-full');
                    modal.firstElementChild.classList.add('translate-y-0');
                } else {
                    modal.firstElementChild.classList.remove('scale-95');
                    modal.firstElementChild.classList.add('scale-100');
                }
            }, 10);
        }

        function openTodayModal() {
            openModal(getTodayEnglishDay());
        }

        function closeModal() {
            const modal = document.getElementById('edit-modal');
            if (window.innerWidth < 640) {
                modal.firstElementChild.classList.remove('translate-y-0');
                modal.firstElementChild.classList.add('translate-y-full');
            } else {
                modal.firstElementChild.classList.remove('scale-100');
                modal.firstElementChild.classList.add('scale-95');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                window.activeDay = null;
            }, 150);
        }

        async function saveBreakfast() {
            if (!window.activeDay) return;
            const inputVal = document.getElementById('breakfast-input').value.trim();
            window.plannerData[window.activeDay] = inputVal;
            
            if (typeof window.saveDataToBackend === 'function') {
                await window.saveDataToBackend();
            }
            closeModal();
        }

        async function clearDay(day) {
            window.plannerData[day] = '';
            if (typeof window.saveDataToBackend === 'function') {
                await window.saveDataToBackend();
            }
        }

        async function resetWeek() {
            const t = translations[currentLang];
            if (confirm(t.resetConfirm)) {
                daysKeyList.forEach(day => window.plannerData[day] = '');
                if (typeof window.saveDataToBackend === 'function') {
                    await window.saveDataToBackend();
                }
            }
        }

        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.warn('Service Worker Registration Failed', err));
            });
        }
    </script>
</body>
</html>
